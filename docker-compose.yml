services:
  merch-tracker:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: "0.0.0.0"
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    volumes:
      # SQLite database — persists across image rebuilds
      - ./data:/app/.output/data
      # Uploaded images — mounted outside .output so Nitro publicAssets serves them at /uploads/
      - ./uploads:/app/uploads
